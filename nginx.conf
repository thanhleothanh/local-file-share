server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/local-file-share.crt;
    ssl_certificate_key /etc/ssl/private/local-file-share.key;

    add_header Cache-Control "no-cache" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
